<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markets — ASX Stock Prices (Print Page)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @page{
    size: 380mm 400mm;
    margin: 0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#dcdcdc;}
  body{font-family:'Roboto Condensed', Arial, sans-serif;color:#111;}

  /* ---------- on-screen chrome (hidden in print) ---------- */
  .toolbar{
    position:fixed;
    top:0;left:0;right:0;
    z-index:50;
    background:#1a1a1a;
    color:#eee;
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    font-family:'Roboto Condensed', sans-serif;
    font-size:13px;
  }
  .toolbar .title{font-weight:700;color:#fff;margin-right:auto;}
  .toolbar button{
    font-family:inherit;
    font-size:12.5px;
    background:#fff;
    color:#111;
    border:none;
    padding:7px 14px;
    cursor:pointer;
    font-weight:500;
  }
  .toolbar button:hover{background:#f0c419;}
  .toolbar .status{color:#9a9a9a;}
  .toolbar .status.live{color:#5fd08a;}
  .toolbar .status.err{color:#ff6b6b;}
  .toolbar label{display:flex;align-items:center;gap:5px;color:#ccc;font-size:12px;}

  .stage-outer{
    padding:64px 20px 40px;
    display:flex;
    justify-content:center;
  }

  /* the physical page, sized in real mm */
  .page{
    width:380mm;
    height:400mm;
    background:#ffffff;
    box-shadow:0 4px 30px rgba(0,0,0,0.35);
    padding:14mm 10mm 12mm;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    flex-shrink:0;
  }

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2.6pt solid #111;
    padding-bottom:4pt;
    margin-bottom:2pt;
  }
  .masthead h1{
    font-family:'Roboto', sans-serif;
    font-weight:900;
    font-size:34pt;
    letter-spacing:0.5pt;
    margin:0;
    line-height:1;
  }
  .masthead .dek{
    font-size:10.5pt;
    font-weight:400;
    color:#333;
    margin-top:3pt;
  }
  .masthead .meta{
    text-align:right;
    font-size:9pt;
    color:#333;
    line-height:1.5;
  }
  .masthead .meta b{color:#111;}
  .rule-thin{border-bottom:0.6pt solid #111;margin-bottom:6pt;}

  /* ---------- three column layout ---------- */
  .columns{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    column-gap:8mm;
    overflow:hidden;
  }
  .col{
    border-left:0.6pt solid #111;
    padding-left:8mm;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .col:first-child{border-left:none;padding-left:0;}

  .col-head{
    display:grid;
    grid-template-columns:2.1fr 1.3fr 1.3fr 1.5fr;
    font-weight:700;
    font-size:8pt;
    border-bottom:1pt solid #111;
    padding-bottom:2pt;
    margin-bottom:1pt;
  }
  .col-head span:not(:first-child){text-align:right;}

  .row{
    display:grid;
    grid-template-columns:2.1fr 1.3fr 1.3fr 1.5fr;
    font-size:6.4pt;
    line-height:8.2pt;
    border-bottom:0.35pt solid #ccc;
  }
  .row:nth-child(odd){background:#f7f7f7;}
  .row .t{font-weight:700;letter-spacing:0.1pt;}
  .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row span:not(.t){text-align:right;}
  .row .up{color:#0f6b34;}
  .row .down{color:#a3231d;}
  .row .flat{color:#666;}

  .footer{
    margin-top:6pt;
    padding-top:4pt;
    border-top:0.6pt solid #111;
    display:flex;
    justify-content:space-between;
    font-size:7pt;
    color:#444;
  }

  @media print{
    body{background:#fff;}
    .toolbar,.stage-outer{all:unset;}
    .toolbar{display:none;}
    .stage-outer{display:block;padding:0;}
    .page{
      width:100%;
      height:100vh;
      box-shadow:none;
      margin:0;
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="title">Markets — Print Page</div>
  <span class="status" id="status">connecting…</span>
  <label><input type="checkbox" id="hideNa" checked> hide inactive tickers</label>
  <button id="refreshBtn">↻ Refresh</button>
  <button id="printBtn">⬇ Export PDF</button>
</div>

<div class="stage-outer">
  <div class="page" id="page">
    <div class="masthead">
      <div>
        <h1>MARKETS</h1>
        <div class="dek">ASX Equities — Price &amp; Movement</div>
      </div>
      <div class="meta">
        <div><b id="dateline">—</b></div>
        <div>Data via Google Finance</div>
      </div>
    </div>
    <div class="rule-thin"></div>

    <div class="columns" id="columns">
      <div class="col"><div class="col-head"><span>Stock</span><span>Last</span><span>Chg</span><span>Chg %</span></div></div>
      <div class="col"><div class="col-head"><span>Stock</span><span>Last</span><span>Chg</span><span>Chg %</span></div></div>
      <div class="col"><div class="col-head"><span>Stock</span><span>Last</span><span>Chg</span><span>Chg %</span></div></div>
    </div>

    <div class="footer">
      <span id="footNote">Loading listings…</span>
      <span id="footSync"></span>
    </div>
  </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0KYpCjISJsIbU-cCLcpOdxTvPJFuigf4xM73HxAK0lNAqkRl765BCPct01e7Z2tejn1fvI1Vmm1ci/pub?gid=451271008&single=true&output=csv";

function num(v){
  if (v === undefined || v === null) return NaN;
  const s = String(v).replace(/[^0-9.\-]/g,'');
  if (s === '' || s === '-') return NaN;
  return parseFloat(s);
}

async function fetchCsvText(){
  const attempts = [
    CSV_URL,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(CSV_URL)
  ];
  const errors = [];
  for (const url of attempts){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if (!res.ok){ errors.push('http '+res.status); continue; }
      const text = await res.text();
      if (text && text.trim().length > 20 && text.includes(',')) return text;
      errors.push('empty response');
    }catch(e){
      errors.push(e && e.message ? e.message : 'network error');
    }
  }
  throw new Error(errors.join(' | '));
}

function parseRows(raw){
  return raw.map(r => {
    const price = num(r['Price']);
    const change = num(r['Change']);
    const changePct = num(r['Change %']);
    return {
      Ticker: (r['Ticker'] || '').trim(),
      Price: price,
      Change: change,
      ChangePct: changePct,
      na: isNaN(price)
    };
  }).filter(r => r.Ticker);
}

function rowHtml(r){
  const dir = r.na ? 'flat' : (r.Change > 0 ? 'up' : r.Change < 0 ? 'down' : 'flat');
  const chgSign = r.na ? '' : (r.Change > 0 ? '+' : r.Change < 0 ? '' : '');
  const pctSign = r.na ? '' : (r.Change < 0 ? '-' : '+');
  const pctVal = isNaN(r.ChangePct) ? '—' : Math.abs(r.ChangePct).toFixed(2)+'%';
  return `<div class="row">
    <span class="t">${r.Ticker}</span>
    <span>${r.na ? '—' : r.Price.toFixed(2)}</span>
    <span class="${dir}">${r.na ? '—' : chgSign+r.Change.toFixed(2)}</span>
    <span class="${dir}">${r.na ? '—' : pctSign+pctVal}</span>
  </div>`;
}

function render(rows){
  const cols = document.querySelectorAll('.col');
  const size = Math.ceil(rows.length / 3);
  const chunks = [rows.slice(0,size), rows.slice(size,size*2), rows.slice(size*2)];
  cols.forEach((col, i) => {
    const head = col.querySelector('.col-head').outerHTML;
    col.innerHTML = head + chunks[i].map(rowHtml).join('');
  });
  document.getElementById('footNote').textContent =
    `${rows.length} listings shown${document.getElementById('hideNa').checked ? ' · inactive tickers hidden' : ''} · source: published Google Sheet`;
}

let allRows = [];

function applyAndRender(){
  const hideNa = document.getElementById('hideNa').checked;
  const rows = (hideNa ? allRows.filter(r => !r.na) : allRows)
    .sort((a,b) => a.Ticker.localeCompare(b.Ticker));
  render(rows);
}

async function load(){
  const status = document.getElementById('status');
  status.className = 'status';
  status.textContent = 'syncing…';
  try{
    const text = await fetchCsvText();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
    allRows = parseRows(parsed.data);
    status.className = 'status live';
    status.textContent = 'live';
    const now = new Date();
    document.getElementById('dateline').textContent = now.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'});
    document.getElementById('footSync').textContent = 'Last synced ' + now.toLocaleTimeString();
    applyAndRender();
  }catch(e){
    status.className = 'status err';
    status.textContent = 'sync failed';
    document.getElementById('footNote').textContent = 'Could not reach the published sheet: ' + e.message;
  }
}

document.getElementById('hideNa').addEventListener('change', applyAndRender);
document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('printBtn').addEventListener('click', () => window.print());

load();
</script>
</body>
</html>
